name: Build & Upload iOS to App Store Connect

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Deploy iOS
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Select Latest Xcode (Xcode 16+)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "Xcode 16 not found, staying with default"
          fi
          echo "Selected Xcode version:"
          xcodebuild -version
          swift --version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛑 Disable Flutter Swift Package Manager
        run: |
          flutter config --no-enable-swift-package-manager

      - name: Install Apple Certificate and Provisioning Profile
        env:
          CERTIFICATE_KEY_BASE64: ${{ secrets.CERTIFICATE_KEY_BASE64 }}
          CERTIFICATE_CER_BASE64: ${{ secrets.CERTIFICATE_CER_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporary_keychain_password_2026"
        run: |
          KEY_PATH=$RUNNER_TEMP/private.key
          CER_PATH=$RUNNER_TEMP/distribution.cer
          PEM_PATH=$RUNNER_TEMP/distribution.pem
          P12_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE_KEY_BASE64" | base64 --decode -o $KEY_PATH
          echo -n "$CERTIFICATE_CER_BASE64" | base64 --decode -o $CER_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          openssl x509 -inform DER -in $CER_PATH -out $PEM_PATH
          openssl pkcs12 -export -inkey $KEY_PATH -in $PEM_PATH -out $P12_PATH -passout pass:"$P12_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $P12_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/9bed1ba2-7e5d-49fa-a446-0436708bbc6c.mobileprovision
          echo "Certificate and provisioning profile installed successfully."

      - name: Create required build directories
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p build/ios/ipa

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          echo "Build complete. Looking for IPA..."
          find build -name "*.ipa" || true

      - name: Find IPA path
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found in build/ios/ipa, searching wider..."
            IPA_PATH=$(find build -name "*.ipa" 2>/dev/null | head -n 1)
          fi
          echo "IPA_FILE_PATH=$IPA_PATH" >> $GITHUB_ENV
          echo "Found IPA at: $IPA_PATH"

      - name: Upload to App Store Connect via TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ env.IPA_FILE_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Save IPA as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BeachMatch-iOS-IPA
          path: build/ios/ipa/
          if-no-files-found: warn
