name: Beach Tennis YouTube Live Scoreboard Tracker

on:
  schedule:
    # Tourne toutes les heures pour vérifier si un live mondial est en cours
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'URL YouTube du live à suivre (laisser vide pour détection automatique)'
        required: false
        default: ''
      match_id:
        description: 'ID du match Firestore (optionnel)'
        required: false
        default: ''

jobs:
  track_live_scores:
    name: Detect & Track Beach Tennis YouTube Lives
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (pour l'extraction YouTube)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🎥 Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp rapidocr-onnxruntime Pillow "firebase-admin>=6.0.0,<7.0.0" "google-cloud-firestore>=2.14.0,<2.20.0"

      - name: 🚀 Lancer le Robot Tracker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "${{ github.event.inputs.youtube_url }}" ]; then
            python backend/youtube_live_tracker.py --url "${{ github.event.inputs.youtube_url }}" --match-id "${{ github.event.inputs.match_id }}"
          else
            python backend/youtube_live_tracker.py
          fi
